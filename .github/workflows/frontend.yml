name: CI Frontend

on:
  push:
    branches: [ main, develop ]
    paths: [ 'frontend/**', '.github/workflows/frontend.yml' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'frontend/**', '.github/workflows/frontend.yml' ]

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      # El backend corre sus pruebas desde el primer día (clean verify) y el
      # frontend solo compilaba: cuatro pruebas rotas llegaron a develop con el
      # CI en verde porque compilar no las ejecuta.
      - name: Pruebas unitarias
        run: npm test -- --watch=false --browsers=ChromeHeadless
        env:
          # El runner trae Chrome instalado; karma-chrome-launcher lo busca acá.
          CHROME_BIN: /usr/bin/google-chrome
