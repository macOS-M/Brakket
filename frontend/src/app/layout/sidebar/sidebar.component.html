<!-- Botón hamburguesa: solo visible en móvil (ver SCSS). -->
<button
  type="button"
  class="menu-toggle"
  [attr.aria-expanded]="abiertoEnMovil()"
  aria-controls="nav-lateral"
  (click)="alternarMenu()"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 7h16M4 12h16M4 17h16" />
  </svg>
  <span class="sr-only">{{ abiertoEnMovil() ? 'Cerrar menú' : 'Abrir menú' }}</span>
</button>

@if (abiertoEnMovil()) {
<div class="menu-backdrop" (click)="cerrarMenu()"></div>
}

<aside class="sidebar" id="nav-lateral" [class.abierto]="abiertoEnMovil()">
  <a class="marca" routerLink="/inicio" (click)="cerrarMenu()">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7z" />
    </svg>
    <span>BRAKKET</span>
  </a>

  <nav class="nav" aria-label="Navegación principal">
    @for (grupo of gruposVisibles(); track grupo.titulo) {
    <div class="grupo">
      @if (grupo.titulo) {
      <p class="grupo-titulo">{{ grupo.titulo }}</p>
      }
      @for (enlace of grupo.enlaces; track enlace.ruta) {
      <a
        [routerLink]="enlace.ruta"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: enlace.exact }"
        [class.pendiente]="enlace.proximamente"
        (click)="cerrarMenu()"
      >
        <span class="icono-caja" aria-hidden="true">
        <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
          @switch (enlace.icono) { @case ('home') {
          <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" />
          } @case ('trophy') {
          <path d="M7 4h10v5a5 5 0 0 1-10 0zM5 5H3v2a3 3 0 0 0 3 3M19 5h2v2a3 3 0 0 1-3 3M9 21h6M12 14v7" />
          } @case ('swords') {
          <path d="M4 4l9 9M20 4l-9 9M14 14l6 6M10 14l-6 6" />
          } @case ('gamepad') {
          <path d="M7 8h10a4 4 0 0 1 4 4v2a3 3 0 0 1-5.2 2L14 15h-4l-1.8 1A3 3 0 0 1 3 14v-2a4 4 0 0 1 4-4zM8 11v3M6.5 12.5h3" />
          } @case ('users') {
          <path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2 20a7 7 0 0 1 14 0M17 11a3 3 0 1 0 0-6M18 20h4a6 6 0 0 0-4-5.6" />
          } @case ('exchange') {
          <path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5" />
          } @case ('shield') {
          <path d="M12 3l8 3v6c0 4.5-3.2 7.9-8 9-4.8-1.1-8-4.5-8-9V6z" />
          } @case ('chart') {
          <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />
          } @case ('star') {
          <path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z" />
          } @case ('bell') {
          <path d="M18 15V10a6 6 0 1 0-12 0v5l-2 3h16zM10 21h4" />
          } @case ('video') {
          <path d="M3 6h13v12H3zM16 10l5-3v10l-5-3z" />
          } @case ('briefcase') {
          <path d="M3 8h18v11H3zM9 8V5h6v3M3 13h18" />
          } @case ('pulse') {
          <path d="M2 12h4l3-7 4 14 3-7h6" />
          } @case ('settings') {
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" />
          <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.3a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-2.8-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 4.5 15H4a2 2 0 1 1 0-4h.2A1.6 1.6 0 0 0 5.3 8.2l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 2.7-1.1V4a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 2.8 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.3a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.4 1z" />
          } }
        </svg>
        </span>
        <span class="etiqueta">{{ enlace.etiqueta }}</span>
        @if (enlace.proximamente) {
        <span class="chip-pronto" title="Aún no implementado">pronto</span>
        }
      </a>
      }
    </div>
    }
  </nav>

  <button
    type="button"
    class="btn-tema"
    [attr.aria-label]="etiquetaTema()"
    [title]="etiquetaTema()"
    (click)="alternarTema()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      @switch (tema()) { @case ('claro') {
      <circle cx="12" cy="12" r="4.5" />
      <path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
      } @case ('oscuro') {
      <path d="M20 13.5A8.5 8.5 0 1 1 10.5 4a6.8 6.8 0 0 0 9.5 9.5z" />
      } @default {
      <path d="M12 3a9 9 0 0 0 0 18z" />
      <circle cx="12" cy="12" r="9" />
      } }
    </svg>
    <span class="texto-tema">
      @switch (tema()) { @case ('claro') { Claro } @case ('oscuro') { Oscuro } @default { Automático } }
    </span>
  </button>

  <!-- La sesión (avatar, rol, salir/entrar) vive en la topbar. -->
</aside>
