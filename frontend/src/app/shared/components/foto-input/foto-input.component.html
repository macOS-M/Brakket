<div class="foto-input" [class.banner]="forma() === 'banner'">
  @if (valor()) {
  <div class="previa">
    <img [src]="valor()" alt="" (error)="quitar()" />
    <button
      type="button"
      class="quitar"
      [disabled]="deshabilitado()"
      (click)="quitar()"
      [attr.aria-label]="'Quitar ' + etiqueta().toLowerCase()"
    >
      ✕
    </button>
  </div>
  } @else {
  <div class="previa vacia" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <path d="M4 7h3l2-2h6l2 2h3v13H4z" />
      <circle cx="12" cy="13" r="4" />
    </svg>
  </div>
  }

  <div class="controles">
    <label class="btn-subir" [class.ocupado]="subiendo() || deshabilitado()">
      {{ subiendo() ? 'Subiendo…' : 'Subir imagen' }}
      <input
        type="file"
        accept="image/png,image/jpeg,image/webp,image/gif"
        [disabled]="subiendo() || deshabilitado()"
        (change)="alElegirArchivo($event)"
        [attr.aria-label]="'Subir ' + etiqueta().toLowerCase() + ' desde tu equipo'"
      />
    </label>
    <span class="pista-archivo">PNG, JPG, WebP o GIF · máximo 5 MB</span>
  </div>

  @if (errorSubida()) {
  <p class="error" role="alert">{{ errorSubida() }}</p>
  }

  @if (recorte(); as r) {
  <!-- Recortador de marco fijo: la imagen se acomoda dentro del cuadro;
       lo que queda afuera se corta antes de subir. -->
  <div class="recorte-fondo" (click)="cancelarRecorte()">
    <div
      class="recorte-dialogo"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="'Encuadrar ' + etiqueta().toLowerCase()"
      tabindex="-1"
      (click)="$event.stopPropagation()"
      (keydown.escape)="cancelarRecorte()"
    >
      <h2>Ajustá el encuadre</h2>
      <p class="recorte-pista">
        Arrastrá la imagen y usá el zoom; lo que quede fuera del marco se recorta.
      </p>

      <div
        class="recorte-marco"
        [style.width.px]="marco.w"
        [style.height.px]="marco.h"
        (pointerdown)="iniciarArrastre($event)"
        (pointermove)="arrastrar($event)"
        (pointerup)="soltarArrastre()"
        (pointercancel)="soltarArrastre()"
      >
        <img
          [src]="r.url"
          alt=""
          draggable="false"
          [style.width.px]="anchoImagen()"
          [style.transform]="'translate(' + ox() + 'px, ' + oy() + 'px)'"
        />
      </div>

      <label class="recorte-zoom">
        Zoom
        <input
          type="range"
          min="1"
          max="3"
          step="0.01"
          [value]="zoom()"
          (input)="alZoom(+$any($event.target).value)"
          aria-label="Nivel de acercamiento"
        />
      </label>

      <div class="recorte-acciones">
        <button type="button" class="recorte-usar" [disabled]="subiendo()" (click)="confirmarRecorte()">
          {{ subiendo() ? 'Subiendo…' : 'Aplicar' }}
        </button>
        <button type="button" class="recorte-cancelar" [disabled]="subiendo()" (click)="cancelarRecorte()">
          Cancelar
        </button>
      </div>
    </div>
  </div>
  }
</div>
