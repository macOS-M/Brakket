@if (espacio(); as e) {
@if (e.enlaceUrl) {
<a class="ad-slot" [href]="e.enlaceUrl" target="_blank" rel="noopener">
  <img [src]="e.imagenUrl" [alt]="e.patrocinadorNombre" />
</a>
} @else {
<div class="ad-slot ad-slot-sin-enlace">
  <img [src]="e.imagenUrl" [alt]="e.patrocinadorNombre" />
</div>
}
}
