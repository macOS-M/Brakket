# Configuracion de spring-dotenv (carga el archivo .env al arrancar el backend).
# El .env vive en la raiz del monorepo, un nivel arriba de backend/, que es
# el directorio de trabajo al correr:  cd backend && ./mvnw spring-boot:run
directory=..

# En Docker/CI no hay archivo .env (las variables se inyectan directamente);
# sin esto la app fallaria al no encontrarlo.
ignoreIfMissing=true
