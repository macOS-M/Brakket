spring.application.name=brakket-backend

# ---------- Base de datos (PostgreSQL) ----------
# Los valores vienen de variables de entorno (ver .env.example). Los defaults
# apuntan al contenedor de docker-compose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/brakket}
spring.datasource.username=${DB_USER:brakket}
spring.datasource.password=${DB_PASSWORD:brakket}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
# Flyway es dueño del esquema; Hibernate solo valida que las entidades calcen.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Flyway (migraciones) ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------- OAuth2 login con Google (EPIC-01) ----------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ---------- Frontend permitido para CORS ----------
brakket.frontend-url=${FRONTEND_URL:http://localhost:4200}

# ---------- Integración Twitch (EPIC-10) ----------
brakket.twitch.client-id=${TWITCH_CLIENT_ID:}
brakket.twitch.client-secret=${TWITCH_CLIENT_SECRET:}
brakket.twitch.channel=${TWITCH_CHANNEL:}

# ---------- Servicio de IA / análisis de sentimiento (EPIC-10) ----------
brakket.ai.api-key=${AI_API_KEY:}
brakket.ai.api-base-url=${AI_API_BASE_URL:}

# ---------- Actuator (RNF-21 observabilidad) ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ---------- Logging ----------
logging.level.cr.brakket=INFO
