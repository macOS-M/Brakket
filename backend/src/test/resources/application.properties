# Overrides SOLO para tests (este archivo .properties pisa el application.yml
# del classpath principal). Los tests y el CI corren sin secretos de Twitch:
# se apaga el fail-fast que en dev/prod exige TWITCH_CLIENT_ID/SECRET.
brakket.twitch.required=false
# El fail-fast del JWT no tiene interruptor: se le da una clave de prueba.
brakket.jwt.secret=clave-de-prueba-para-tests-de-al-menos-32-caracteres
